events {}

http {
  server {
    listen 80;
    server_name centralized-monitoring.duckdns.org;

    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name centralized-monitoring.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/centralized-monitoring.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/centralized-monitoring.duckdns.org/privkey.pem;

    location = /health {
      default_type application/json;
      return 200 '{"service":"nginx-gateway","status":"ok"}';
    }

    location / {
      proxy_pass http://web-dashboard:3010;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}