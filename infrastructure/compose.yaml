services:
  asset-db:
    image: postgres:17-alpine
    container_name: asset-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ASSET_DB_USER}
      POSTGRES_PASSWORD: ${ASSET_DB_PASSWORD}
      POSTGRES_DB: ${ASSET_DB_NAME}
    ports:
      - "${ASSET_DB_PORT}:5432"
    volumes:
      - asset_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ASSET_DB_USER} -d ${ASSET_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  asset-service:
    build:
      context: ../services/asset-management-service
      dockerfile: Dockerfile
    image: centralized-monitoring/asset-service:dev
    restart: unless-stopped

    env_file:
      - ../services/asset-management-service/.env

    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${ASSET_DB_USER}:${ASSET_DB_PASSWORD}@asset-db:5432/${ASSET_DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    ports:
      - 3000:3000

    depends_on:
      asset-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
    ports:
      - "${INFLUXDB_PORT}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:latest
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  monitoring-db:
    image: postgres:17-alpine
    container_name: monitoring-db
    environment:
      POSTGRES_USER: ${MONITORING_DB_USER}
      POSTGRES_PASSWORD: ${MONITORING_DB_PASSWORD}
      POSTGRES_DB: ${MONITORING_DB_NAME}
    ports:
      - "${MONITORING_DB_PORT}:5432"
    volumes:
      - monitoring_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${MONITORING_DB_USER} -d ${MONITORING_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  monitoring-service:
    build:
      context: ../services/monitoring-service
      dockerfile: Dockerfile
    image: centralized-monitoring/monitoring-service:dev
    restart: unless-stopped
    env_file:
      - ../services/monitoring-service/.env
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${MONITORING_DB_USER}:${MONITORING_DB_PASSWORD}@monitoring-db:5432/${MONITORING_DB_NAME}
      ASSET_SERVICE_URL: http://asset-service:3000
      ALERTING_SERVICE_URL: http://alerting-service:3002
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_ALERT_QUEUE: alert_events
      RABBITMQ_AUDIT_QUEUE: audit_events
    ports:
      - "3001:3001"
    depends_on:
      monitoring-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_started
      asset-service:
        condition: service_started
      alerting-service:
        condition: service_started

  alerting-db:
    image: postgres:17-alpine
    container_name: alerting-db
    environment:
      POSTGRES_USER: ${ALERTING_DB_USER}
      POSTGRES_PASSWORD: ${ALERTING_DB_PASSWORD}
      POSTGRES_DB: ${ALERTING_DB_NAME}
    ports:
      - "${ALERTING_DB_PORT}:5432"
    volumes:
      - alerting_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${ALERTING_DB_USER} -d ${ALERTING_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  alerting-service:
    build:
      context: ../services/alerting-service
      dockerfile: Dockerfile
    image: centralized-monitoring/alerting-service:dev
    restart: unless-stopped
    env_file:
      - ../services/alerting-service/.env
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://${ALERTING_DB_USER}:${ALERTING_DB_PASSWORD}@alerting-db:5432/${ALERTING_DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_ALERT_QUEUE: alert_events
      RABBITMQ_NOTIFICATION_QUEUE: notification_events
      RABBITMQ_AUDIT_QUEUE: audit_events
    ports:
      - "3002:3002"
    depends_on:
      alerting-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  auth-db:
    image: postgres:17-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    image: centralized-monitoring/auth-service:dev
    restart: unless-stopped
    env_file:
      - ../services/auth-service/.env
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: postgresql://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@auth-db:5432/${AUTH_DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_AUDIT_QUEUE: audit_events
      RABBITMQ_NOTIFICATION_QUEUE: notification_events
    ports:
      - "3004:3004"
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  security-report-db:
    image: postgres:17-alpine
    container_name: security-report-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SECURITY_REPORT_DB_USER}
      POSTGRES_PASSWORD: ${SECURITY_REPORT_DB_PASSWORD}
      POSTGRES_DB: ${SECURITY_REPORT_DB_NAME}
    ports:
      - "${SECURITY_REPORT_DB_PORT}:5432"
    volumes:
      - security_report_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SECURITY_REPORT_DB_USER} -d ${SECURITY_REPORT_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  security-report-service:
    build:
      context: ../services/security_report-service
      dockerfile: Dockerfile
    image: centralized-monitoring/security-report-service:dev
    restart: unless-stopped
    env_file:
      - ../services/security_report-service/.env
    environment:
      PORT: 3006
      DATABASE_URL: postgresql://${SECURITY_REPORT_DB_USER}:${SECURITY_REPORT_DB_PASSWORD}@security-report-db:5432/${SECURITY_REPORT_DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_AUDIT_QUEUE: audit_events
      ASSET_SERVICE_URL: http://asset-service:3000
      MONITORING_SERVICE_URL: http://monitoring-service:3001
      ALERTING_SERVICE_URL: http://alerting-service:3002
      LIBREOFFICE_PATH: /usr/bin/libreoffice
      REPORT_TEMPLATE_PATH: templates/monitoring-report-template.docx
      REPORT_TEMPLATE_VERSION: v9
    ports:
      - "3006:3006"
    volumes:
      - report_storage:/app/storage/reports
    depends_on:
      security-report-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      asset-service:
        condition: service_started
      monitoring-service:
        condition: service_started
      alerting-service:
        condition: service_started

  notification-db:
    image: postgres:17-alpine
    container_name: notification-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
    ports:
      - "${NOTIFICATION_DB_PORT}:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${NOTIFICATION_DB_USER} -d ${NOTIFICATION_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    image: centralized-monitoring/notification-service:dev
    restart: unless-stopped
    env_file:
      - ../services/notification-service/.env
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://${NOTIFICATION_DB_USER}:${NOTIFICATION_DB_PASSWORD}@notification-db:5432/${NOTIFICATION_DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_NOTIFICATION_QUEUE: notification_events
      RABBITMQ_AUDIT_QUEUE: audit_events
    ports:
      - "3003:3003"
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    image: centralized-monitoring/api-gateway:dev
    restart: unless-stopped
    env_file:
      - ../services/api-gateway/.env
    environment:
      PORT: 3005
      ASSET_SERVICE_URL: http://asset-service:3000
      MONITORING_SERVICE_URL: http://monitoring-service:3001
      ALERTING_SERVICE_URL: http://alerting-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      AUTH_SERVICE_URL: http://auth-service:3004
      SECURITY_REPORT_SERVICE_URL: http://security-report-service:3006
    ports:
      - "3005:3005"
    depends_on:
      asset-service:
        condition: service_started
      monitoring-service:
        condition: service_started
      alerting-service:
        condition: service_started
      notification-service:
        condition: service_started
      auth-service:
        condition: service_started
      security-report-service:
        condition: service_started

volumes:
  asset_db_data:
  influxdb_data:
  rabbitmq_data:
  monitoring_db_data:
  alerting_db_data:
  auth_db_data:
  security_report_db_data:
  notification_db_data:
  report_storage:
